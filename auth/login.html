<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Sign In — QuoteChase</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700;800&display=swap">
  <link rel="stylesheet" href="../css/main.css" />
  <link rel="icon" href="/icons/favicon-32.png" type="image/png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#0F1117">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">


  <!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-VTYDGVXW89"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-VTYDGVXW89');
</script>


</head>
<body>
  <div class="auth-page">
    <div class="auth-card fade-up">

      <div class="auth-card__logo">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 50" width="140" height="44">
          <g transform="translate(4,7)">
            <circle cx="18" cy="18" r="14" fill="none" stroke="#6B7280" stroke-width="3.5"/>
            <path d="M12 23 L32 3 M32 3 L22 3 M32 3 L32 13" stroke="#FF7A00" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
          </g>
          <text x="52" y="32" font-family="'DM Sans', sans-serif" font-size="20" font-weight="800" fill="#F8F9FA" letter-spacing="-0.5">Quote<tspan fill="#FF7A00" font-weight="400">Chase</tspan></text>
        </svg>
      </div>

      <h1 class="auth-card__title">Welcome back</h1>
      <p class="auth-card__sub">Sign in to your QuoteChase account</p>

      <div class="alert alert--error" id="error-msg" role="alert"></div>

      <div class="form-group">
        <label class="form-label" for="email">Email address</label>
        <input class="form-input" type="email" id="email" name="email"
               placeholder="you@yourbusiness.co.uk" autocomplete="email" required />
      </div>

      <div class="form-group">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;">
          <label class="form-label" for="password" style="margin-bottom:0;">Password</label>
          <a href="/auth/forgot-password.html" class="text-xs text-orange">Forgot password?</a>
        </div>
        <input class="form-input" type="password" id="password" name="password"
               placeholder="••••••••" autocomplete="current-password" required />
      </div>

      <div class="captcha" id="captcha"></div>

      <button class="btn btn--primary w-full mt-8" id="login-btn" type="button">
        <span id="btn-text">Sign in</span>
        <span class="spinner" id="spinner"></span>
      </button>

      <div class="auth-card__footer">
        Don't have an account? <a href="/auth/signup.html">Start free trial</a>
      </div>

    </div>
  </div>

  <script async defer src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit"></script>
  <script defer src="/js/vendor/supabase.js"></script>
  <script type="module">
    import { signIn, getSession, friendlyAuthError } from '/js/auth.js';
    import { trackVisit } from '/js/tracker.js';
    import { captcha, CAPTCHA_ERROR } from '/js/turnstile.js';

    trackVisit();

    // Redirect if already logged in
    getSession().then(session => {
      if (session) window.location.href = '/dashboard/index.html';
    }).catch(() => {});

    const emailInput    = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const loginBtn      = document.getElementById('login-btn');
    const btnText       = document.getElementById('btn-text');
    const spinner       = document.getElementById('spinner');
    const errorMsg      = document.getElementById('error-msg');
    const check         = captcha(document.getElementById('captcha'), loginBtn);

    function setLoading(on) {
      loginBtn.disabled = on || !check.token();
      btnText.textContent = on ? 'Signing in…' : 'Sign in';
      spinner.classList.toggle('visible', on);
    }

    function showError(msg) {
      errorMsg.textContent = msg;
      errorMsg.classList.add('visible');
    }

    function clearError() {
      errorMsg.classList.remove('visible');
    }

    async function handleLogin() {
      clearError();
      const email    = emailInput.value.trim();
      const password = passwordInput.value;

      if (!email || !password) {
        showError('Please enter your email and password.');
        return;
      }
      if (!check.token()) { showError(CAPTCHA_ERROR); return; }

      setLoading(true);
      try {
        await signIn(email, password, check.token());
        window.location.href = '/dashboard/index.html';
      } catch (err) {
        showError(friendlyAuthError(err));
        check.reset();
        setLoading(false);
      }
    }

    loginBtn.addEventListener('click', handleLogin);

    // Allow Enter key
    [emailInput, passwordInput].forEach(el => {
      el.addEventListener('keydown', e => { if (e.key === 'Enter') handleLogin(); });
    });
  </script>
</body>
</html>
