<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Start Free Trial — QuoteChase</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700;800&display=swap">
  <link rel="stylesheet" href="../css/main.css" />
  <link rel="stylesheet" href="/css/logo.css" />
  <link rel="icon" href="/icons/favicon-32.png" type="image/png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#0F1117">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">


  <!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-VTYDGVXW89"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-VTYDGVXW89', { page_location: location.origin + location.pathname }); // no query strings (invite tokens) to Google
</script>


</head>
<body>
  <div class="auth-page">
    <div class="auth-card fade-up">

      <div class="auth-card__logo">
        <a href="/" class="logo" aria-label="QuoteChase"><img src="/icons/logo-72.png" width="36" height="36" alt=""><span class="logo__word">Quote<span>Chase</span></span></a>
      </div>

      <h1 class="auth-card__title" id="signup-title">Start your free trial</h1>
      <p class="auth-card__sub" id="signup-sub">14 days free. No card required. Win more jobs from your quotes.</p>

      <div class="alert alert--error"   id="error-msg"   role="alert"></div>
      <div class="alert alert--success" id="success-msg" role="status"></div>

      <div class="form-group" id="business-group">
        <label class="form-label" for="business-name">Business name</label>
        <input class="form-input" type="text" id="business-name" name="business-name" maxlength="120"
               placeholder="Smith Roofing Ltd" autocomplete="organization" required />
      </div>

      <div class="form-group">
        <label class="form-label" for="owner-name">Your name</label>
        <input class="form-input" type="text" id="owner-name" name="owner-name" maxlength="80"
               placeholder="John Smith" autocomplete="name" required />
      </div>

      <div class="form-group">
        <label class="form-label" for="email">Email address</label>
        <input class="form-input" type="email" id="email" name="email" maxlength="254"
               placeholder="john@smithroofing.co.uk" autocomplete="email" required />
        <p class="form-hint" id="invite-email-hint" hidden>Use the email address your invite was sent to.</p>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input class="form-input" type="password" id="password" name="password"
               placeholder="At least 8 characters" autocomplete="new-password" required />
        <p class="form-hint">Minimum 8 characters</p>
      </div>

      <div class="captcha" id="captcha"></div>

      <button class="btn btn--primary w-full mt-8" id="signup-btn" type="button">
        <span id="btn-text">Create free account</span>
        <span class="spinner" id="spinner"></span>
      </button>

      <p class="text-xs text-muted mt-16" style="text-align:center;line-height:1.6;">
        By signing up you agree to our
        <a href="/terms.html" class="text-orange">Terms</a> and
        <a href="/privacy.html" class="text-orange">Privacy Policy</a>.
      </p>

      <div class="auth-card__footer">
        Already have an account? <a href="/auth/login.html">Sign in</a>
      </div>

    </div>
  </div>

  <script async defer src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit"></script>
  <script defer src="/js/vendor/supabase.js"></script>
  <script type="module">
    import { signUp, getSession, friendlyAuthError } from '/js/auth.js';
    import { trackVisit } from '/js/tracker.js';
    import { captcha, CAPTCHA_WAIT } from '/js/captcha.js';

    trackVisit();

    // Redirect if already logged in
    getSession().then(session => {
      if (session) window.location.href = '/dashboard/index.html';
    }).catch(() => {});

    const businessNameInput = document.getElementById('business-name');
    const ownerNameInput    = document.getElementById('owner-name');
    const emailInput        = document.getElementById('email');
    const passwordInput     = document.getElementById('password');
    const signupBtn         = document.getElementById('signup-btn');
    const btnText           = document.getElementById('btn-text');
    const spinner           = document.getElementById('spinner');
    const errorMsg          = document.getElementById('error-msg');
    const successMsg        = document.getElementById('success-msg');
    const check             = captcha(document.getElementById('captcha'));

    // Invite mode: /auth/signup.html?invite=<token> joins an existing team
    const inviteToken = new URLSearchParams(location.search).get('invite');
    if (inviteToken) {
      document.getElementById('business-group').hidden = true;
      document.getElementById('invite-email-hint').hidden = false;
      document.getElementById('signup-title').textContent = 'Join your team on QuoteChase';
      document.getElementById('signup-sub').textContent = 'Create your login to start sending and tracking quotes with your team.';
      btnText.textContent = 'Join team';
    }

    function setLoading(on) {
      signupBtn.disabled = on;
      btnText.textContent = on ? 'Creating account…' : inviteToken ? 'Join team' : 'Create free account';
      spinner.classList.toggle('visible', on);
    }

    function showError(msg) {
      errorMsg.textContent = msg;
      errorMsg.classList.add('visible');
      successMsg.classList.remove('visible');
    }

    function showSuccess(msg) {
      successMsg.textContent = msg;
      successMsg.classList.add('visible');
      errorMsg.classList.remove('visible');
    }

    function clearMessages() {
      errorMsg.classList.remove('visible');
      successMsg.classList.remove('visible');
    }

    async function handleSignup() {
      clearMessages();

      const businessName = businessNameInput.value.trim();
      const ownerName    = ownerNameInput.value.trim();
      const email        = emailInput.value.trim();
      const password     = passwordInput.value;

      if ((!businessName && !inviteToken) || !ownerName || !email || !password) {
        showError('Please fill in all fields.');
        return;
      }
      if (password.length < 8) {
        showError('Password must be at least 8 characters.');
        return;
      }
      if (!check.token()) { showError(CAPTCHA_WAIT); return; }

      setLoading(true);
      try {
        // The database creates the business + owner (or joins the invite's team) from this metadata
        const metadata = inviteToken
          ? { full_name: ownerName, invite_token: inviteToken }
          : { business_name: businessName, full_name: ownerName };
        const authData = await signUp(email, password, metadata, check.token());

        if (!authData?.session) {
          // Email confirmation is on — no session until they confirm
          showSuccess('Check your email to confirm your account, then sign in.');
          setLoading(false);
          return;
        }

        window.location.href = inviteToken ? '/dashboard/index.html' : '/auth/onboarding.html';

      } catch (err) {
        // A bad invite fails inside the database, which Supabase reports as a generic database error
        showError(inviteToken && /database error/i.test(err.message || '')
          ? 'This invite link is invalid or has expired. Ask your team owner for a new one.'
          : friendlyAuthError(err));
        setLoading(false);
      } finally {
        check.reset();
      }
    }

    signupBtn.addEventListener('click', handleSignup);

    [businessNameInput, ownerNameInput, emailInput, passwordInput].forEach(el => {
      el.addEventListener('keydown', e => { if (e.key === 'Enter') handleSignup(); });
    });
  </script>
</body>
</html>
