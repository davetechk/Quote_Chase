<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Set New Password — QuoteChase</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700;800&display=swap">
  <link rel="stylesheet" href="../css/main.css" />
  <link rel="stylesheet" href="/css/logo.css" />
  <link rel="icon" href="/icons/favicon-32.png" type="image/png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#0F1117">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body>
  <div class="auth-page">
    <div class="auth-card fade-up">

      <div class="auth-card__logo">
        <a href="/" class="logo" aria-label="QuoteChase"><img src="/icons/logo-72.png" width="36" height="36" alt=""><span class="logo__word">Quote<span>Chase</span></span></a>
      </div>

      <!-- Loading state while Supabase processes the token -->
      <div id="loading-state">
        <p class="auth-card__sub" style="text-align:center;">Verifying your link…</p>
        <div style="display:flex;justify-content:center;margin-top:16px;">
          <span class="spinner visible" style="border-top-color:var(--orange);border-color:rgba(255,122,0,0.2);"></span>
        </div>
      </div>

      <!-- Form shown once token is verified -->
      <div id="form-state" style="display:none;">
        <h1 class="auth-card__title">Set new password</h1>
        <p class="auth-card__sub">Choose a strong password for your account.</p>

        <div class="alert alert--error" id="error-msg" role="alert"></div>

        <div class="form-group">
          <label class="form-label" for="password">New password</label>
          <input class="form-input" type="password" id="password" name="password"
                 placeholder="At least 8 characters" autocomplete="new-password" required />
          <p class="form-hint">Minimum 8 characters</p>
        </div>

        <div class="form-group">
          <label class="form-label" for="confirm-password">Confirm password</label>
          <input class="form-input" type="password" id="confirm-password" name="confirm-password"
                 placeholder="Repeat your new password" autocomplete="new-password" required />
        </div>

        <button class="btn btn--primary w-full mt-8" id="update-btn" type="button">
          <span id="btn-text">Update password</span>
          <span class="spinner" id="spinner"></span>
        </button>
      </div>

      <!-- Error state if link is invalid / expired -->
      <div id="error-state" style="display:none;">
        <h1 class="auth-card__title">Link expired</h1>
        <p class="auth-card__sub">This reset link has expired or already been used.</p>
        <a href="/auth/forgot-password.html" class="btn btn--primary w-full mt-8">Request a new link</a>
      </div>

      <!-- Success state -->
      <div id="success-state" style="display:none;">
        <div style="text-align:center;">
          <div style="font-size:3rem;margin-bottom:16px;">✓</div>
          <h1 class="auth-card__title">Password updated</h1>
          <p class="auth-card__sub">Your password has been changed. You can now sign in.</p>
          <a href="/auth/login.html" class="btn btn--primary mt-24" style="display:inline-flex;">Go to sign in</a>
        </div>
      </div>

    </div>
  </div>

  <script defer src="/js/vendor/supabase.js"></script>
  <script type="module">
    import { supabase } from '/js/supabase.js';
    import { updatePassword, friendlyAuthError } from '/js/auth.js';
    import { trackVisit } from '/js/tracker.js';

    trackVisit();

    const loadingState  = document.getElementById('loading-state');
    const formState     = document.getElementById('form-state');
    const errorState    = document.getElementById('error-state');
    const successState  = document.getElementById('success-state');
    const passwordInput = document.getElementById('password');
    const confirmInput  = document.getElementById('confirm-password');
    const updateBtn     = document.getElementById('update-btn');
    const btnText       = document.getElementById('btn-text');
    const spinner       = document.getElementById('spinner');
    const errorMsg      = document.getElementById('error-msg');

    function show(el) {
      loadingState.style.display = 'none';
      formState.style.display    = 'none';
      errorState.style.display   = 'none';
      successState.style.display = 'none';
      el.style.display = 'block';
    }

    function setLoading(on) {
      updateBtn.disabled = on;
      btnText.textContent = on ? 'Updating…' : 'Update password';
      spinner.classList.toggle('visible', on);
    }

    // Supabase fires PASSWORD_RECOVERY event when the reset link is opened
    supabase.auth.onAuthStateChange((event, session) => {
      if (event === 'PASSWORD_RECOVERY') {
        show(formState);
      } else if (event === 'SIGNED_IN' && !session) {
        show(errorState);
      }
    });

    // Fallback: if no event fires within 3s, show error
    const fallback = setTimeout(() => {
      if (loadingState.style.display !== 'none') show(errorState);
    }, 3000);

    async function handleUpdate() {
      errorMsg.classList.remove('visible');
      const password = passwordInput.value;
      const confirm  = confirmInput.value;

      if (password.length < 8) {
        errorMsg.textContent = 'Password must be at least 8 characters.';
        errorMsg.classList.add('visible');
        return;
      }
      if (password !== confirm) {
        errorMsg.textContent = 'Passwords do not match.';
        errorMsg.classList.add('visible');
        return;
      }

      clearTimeout(fallback);
      setLoading(true);
      try {
        await updatePassword(password);
        show(successState);
      } catch (err) {
        errorMsg.textContent = friendlyAuthError(err);
        errorMsg.classList.add('visible');
        setLoading(false);
      }
    }

    updateBtn?.addEventListener('click', handleUpdate);
    confirmInput?.addEventListener('keydown', e => { if (e.key === 'Enter') handleUpdate(); });
  </script>
</body>
</html>
