<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Reset Password — QuoteChase</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700;800&display=swap">
  <link rel="stylesheet" href="../css/main.css" />
  <link rel="icon" href="/icons/favicon-32.png" type="image/png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#0F1117">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body>
  <div class="auth-page">
    <div class="auth-card fade-up">

      <div class="auth-card__logo">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 50" width="140" height="44">
          <g transform="translate(4,7)">
            <circle cx="18" cy="18" r="14" fill="none" stroke="#6B7280" stroke-width="3.5"/>
            <path d="M12 23 L32 3 M32 3 L22 3 M32 3 L32 13" stroke="#FF7A00" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
          </g>
          <text x="52" y="32" font-family="'DM Sans', sans-serif" font-size="20" font-weight="800" fill="#F8F9FA" letter-spacing="-0.5">Quote<tspan fill="#FF7A00" font-weight="400">Chase</tspan></text>
        </svg>
      </div>

      <h1 class="auth-card__title">Forgot your password?</h1>
      <p class="auth-card__sub">Enter your email and we'll send you a reset link.</p>

      <div class="alert alert--error"   id="error-msg"   role="alert"></div>
      <div class="alert alert--success" id="success-msg" role="status"></div>

      <div class="form-group" id="form-fields">
        <label class="form-label" for="email">Email address</label>
        <input class="form-input" type="email" id="email" name="email"
               placeholder="you@yourbusiness.co.uk" autocomplete="email" required />
      </div>

      <div class="captcha" id="captcha"></div>

      <button class="btn btn--primary w-full mt-8" id="reset-btn" type="button">
        <span id="btn-text">Send reset link</span>
        <span class="spinner" id="spinner"></span>
      </button>

      <div class="auth-card__footer">
        <a href="/auth/login.html" class="text-orange">← Back to sign in</a>
      </div>

    </div>
  </div>

  <script async defer src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit"></script>
  <script defer src="/js/vendor/supabase.js"></script>
  <script type="module">
    import { resetPassword, friendlyAuthError } from '/js/auth.js';
    import { trackVisit } from '/js/tracker.js';
    import { captcha, CAPTCHA_WAIT } from '/js/turnstile.js?v=2';

    trackVisit();

    const emailInput = document.getElementById('email');
    const resetBtn   = document.getElementById('reset-btn');
    const btnText    = document.getElementById('btn-text');
    const spinner    = document.getElementById('spinner');
    const errorMsg   = document.getElementById('error-msg');
    const successMsg = document.getElementById('success-msg');
    const formFields = document.getElementById('form-fields');
    const captchaEl  = document.getElementById('captcha');
    const check      = captcha(captchaEl);

    function setLoading(on) {
      resetBtn.disabled = on;
      btnText.textContent = on ? 'Sending…' : 'Send reset link';
      spinner.classList.toggle('visible', on);
    }

    function showError(msg) {
      errorMsg.textContent = msg;
      errorMsg.classList.add('visible');
      successMsg.classList.remove('visible');
    }

    async function handleReset() {
      errorMsg.classList.remove('visible');
      const email = emailInput.value.trim();
      if (!email) { showError('Please enter your email address.'); return; }
      if (!check.token()) { showError(CAPTCHA_WAIT); return; }

      setLoading(true);
      try {
        await resetPassword(email, check.token());
        // Hide the form, show success
        formFields.style.display = 'none';
        resetBtn.style.display   = 'none';
        captchaEl.style.display  = 'none';
        successMsg.textContent   = `We've sent a reset link to ${email}. Check your inbox (and spam folder).`;
        successMsg.classList.add('visible');
      } catch (err) {
        showError(friendlyAuthError(err));
        setLoading(false);
      } finally {
        check.reset();
      }
    }

    resetBtn.addEventListener('click', handleReset);
    emailInput.addEventListener('keydown', e => { if (e.key === 'Enter') handleReset(); });
  </script>
</body>
</html>
